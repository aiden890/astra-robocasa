<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astra · 같은 씬 영상 비교</title><link rel="stylesheet" href="assets/compare.css"><script src="assets/compare.js" defer></script></head><body><header><h1>Astra · 같은 씬 비교</h1><a href="visualizer.html">기존 시각화 패널 ↗</a></header><main><section class="controls"><div class="filters"><label>실험 묶음<select id="collection"></select></label><label>태스크 · 초기 씬<select id="scene"></select></label><label>입력 조건<select id="condition"><option value="">전체</option><option value="rgb">RGB만</option><option value="color">RGB + depth 이미지</option><option value="pixel">RGB + 픽셀 Z</option><option value="grid">RGB + grid Z</option></select></label><label>히스토리<select id="history"><option value="">전체</option><option value="0">없음</option><option value="3">3초</option><option value="5">5초</option></select></label></div><p id="scope">같은 실험 묶음·씬·로봇의 영상만 비교합니다.</p><div class="transport"><button id="play">함께 재생</button><button id="reset">처음으로</button><label>속도<select id="speed"><option value="0.25" selected>0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option></select></label><span id="position">스텝 0</span><button id="refresh">최신 기록 불러오기</button></div><input id="seek" aria-label="공통 시뮬레이션 스텝" type="range" min="0" max="1" value="0" step="1"><p class="note">같은 native 스텝으로 맞춥니다. 모델 응답 대기 시간은 영상에 포함되지 않습니다. 저장된 구간이 끝난 영상은 마지막 프레임에서 멈춥니다.</p><p id="notice" role="status"></p></section><section id="grid" aria-label="동일 씬 실험 영상"></section></main></body></html>
