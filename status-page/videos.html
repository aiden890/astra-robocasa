<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboCasa · Astra | 영상</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="style.css">
<script src="assets/theme.js"></script>
</head>
<body>
<a class="skip" href="#content">본문으로 이동</a>
<header>
  <nav class="nav">
    <div class="brand">Robo<span>Casa</span> · Astra</div>
    <div class="nav-tabs" aria-label="페이지 탭"><a href="index.html">메인</a><a href="videos.html" class="active" aria-current="page">영상</a></div>
  </nav>
</header>
<main id="content" class="wrap" aria-label="롤아웃 영상 게시판">
<h1>롤아웃 영상</h1>
<p class="dim">매 제어 스텝을 저장한 20fps 영상입니다. 재생 시간은 시뮬레이션 시간이며 모델 응답 대기는 포함하지 않습니다.</p>
<div class="card filters">
<label>로봇 <select id="robot"><option value="">전체</option><option>PandaOmron</option><option>GR1FloatingBody</option></select></label>
<label>태스크 <select id="task"><option value="">전체</option><option>PrepareCoffee</option></select></label>
<label>결과 <select id="status"><option value="">전체</option><option>진행 중</option><option>성공</option><option>미성공</option><option>오류</option></select></label>
<label class="search">검색 <input id="search" type="search" placeholder="실행 이름 검색"></label>
</div>
<p id="count" class="dim" aria-live="polite">목록을 불러오는 중입니다.</p>
<div class="card board"><table><thead><tr><th>번호</th><th>실행 / 로봇</th><th>태스크</th><th>결과</th><th>스텝</th><th>영상 길이</th><th>영상</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pagination"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div>
<dialog id="player"><div class="player-head"><h2 id="player-title"></h2><button id="close-player" aria-label="영상 닫기">닫기</button></div><video id="video" controls playsinline preload="metadata"></video><p id="detail" class="dim"></p></dialog>
<script src="assets/videos.js"></script>
</main>
</body>
</html>
