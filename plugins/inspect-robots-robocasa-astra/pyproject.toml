[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "inspect-robots-robocasa-astra"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["inspect-robots", "pillow>=10"]
[project.scripts]
robocasa-astra = "robocasa_astra.run:main"
[tool.hatch.build.targets.wheel]
packages = ["src/robocasa_astra"]
